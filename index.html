<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://script.google.com">
<link rel="preconnect" href="https://script.googleusercontent.com">
<title>Stay in touch</title>
<!-- NewCo consent form T2.1. The ONLY per-client edit is ENDPOINT below. Everything else comes from the Config tab. -->
<style>
:root{--bg:#fff;--fg:#1a1a1a;--mut:#5f6368;--bd:#c9ced6;--ac:#1F3864;--err:#b42318}
@media (prefers-color-scheme:dark){:root{--bg:#161616;--fg:#f2f2f2;--mut:#a0a4ab;--bd:#3a3d42;--err:#f97066}}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:480px;margin:0 auto;padding:24px 16px}
img{max-height:48px;max-width:100%;margin-bottom:12px}
h1{font-size:22px;margin:0 0 6px}
p{margin:0 0 14px}.mut{color:var(--mut);font-size:14px}
label{display:block;font-weight:600;margin:14px 0 4px}
input[type=text],input[type=email],input[type=tel],select,textarea{width:100%;box-sizing:border-box;padding:10px;font:inherit;color:var(--fg);background:var(--bg);border:1px solid var(--bd);border-radius:8px}
fieldset{border:0;padding:0;margin:18px 0 0}legend{font-weight:600;padding:0;margin-bottom:6px}
.chk{display:flex;gap:10px;align-items:flex-start;font-weight:400;margin:8px 0}.chk input{margin-top:5px}
button{margin-top:18px;width:100%;padding:12px;font:inherit;font-weight:600;color:#fff;background:var(--ac);border:0;border-radius:8px;cursor:pointer}
button:disabled{opacity:.6}a{color:var(--ac)}
@media (prefers-color-scheme:dark){a{color:#9db8ff}}
#msg{margin-top:12px;font-weight:600}.err{color:var(--err)}
.hp{position:absolute;left:-9999px;height:0;overflow:hidden}
h2{font-size:17px;margin:18px 0 6px}[hidden]{display:none!important}
.tabs{display:flex;gap:8px;margin:16px 0 8px}.tabs button{margin:0;flex:1;width:auto;color:var(--fg);background:transparent;border:1px solid var(--bd)}
.tabs button[aria-selected=true]{color:#fff;background:var(--ac);border-color:var(--ac)}
.wrap{overflow-x:auto}table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:8px 6px;border-bottom:1px solid var(--bd);vertical-align:top;font-size:15px}th{font-weight:600;width:42%}
td input[type=text],td select,td textarea{margin:0}
</style>
</head>
<body>
<main id="app"><p class="mut">Loading…</p></main>
<script>
const ENDPOINT = 'https://script.google.com/macros/s/AKfycbwilKUwXeHoSVOLXbEA7CZcQWqMUuthSbXloNbdSMgTeW_-AE5JhjAChmy8eeUmx3OW/exec';

const el = (t, p, ...kids) => { const e = document.createElement(t); Object.assign(e, p || {}); kids.forEach(k => e.append(k)); return e; };
const params = new URLSearchParams(location.search);
const app = document.getElementById('app');
let cfg;

async function load() {
  try { cfg = await (await fetch(ENDPOINT + '?a=config')).json(); } catch (e) { cfg = { ok: false }; }
  if (!cfg.ok) return app.replaceChildren(el('p', { textContent: 'This form isn’t available right now.' }));
  params.get('p') === 'data' ? renderData() : params.get('p') === 'request' ? renderRequest() : params.get('p') === 'correct' ? renderCorrect() : render();
}

function render() {
  const s = cfg.settings, startedAt = Date.now();
  document.documentElement.lang = s.language || 'en';
  document.title = s.form_title;
  if (/^#[0-9a-f]{3,8}$/i.test(s.brand_color)) document.documentElement.style.setProperty('--ac', s.brand_color);

  const form = el('form', { noValidate: false });
  if (/^https:\/\//i.test(s.logo_url)) form.append(el('img', { src: s.logo_url, alt: s.client_name }));
  form.append(el('h1', { textContent: s.form_title }), el('p', { textContent: s.intro_text }));

  cfg.fields.forEach(f => {
    const id = 'f_' + f.field_id;
    let input;
    if (f.type === 'textarea') input = el('textarea', { rows: 4 });
    else if (f.type === 'select') {
      input = el('select', {}, el('option', { value: '', textContent: 'Select…' }),
        ...String(f.options).split(';').map(o => el('option', { value: o, textContent: o })));
    } else input = el('input', { type: ['email', 'tel'].includes(f.type) ? f.type : 'text' });
    Object.assign(input, { id, name: id, required: f.required });
    form.append(el('label', { htmlFor: id, textContent: f.label + (f.required ? '' : ' (optional)') }), input);
    if (f.help_text) form.append(el('div', { className: 'mut', textContent: f.help_text }));
  });

  // notice: what we use the details for (service purposes), and who is responsible
  const usedBy = new Set(cfg.fields.map(f => f.purpose_id));
  const notice = cfg.purposes.filter(p => p.type === 'service' && usedBy.has(p.purpose_id)).map(p => p.wording).join(' ');
  form.append(el('p', { className: 'mut', style: 'margin-top:16px' }, notice + ' ' + s.responsible_party_legal_name + ' is responsible for your information. ',
    /^https:\/\//i.test(s.privacy_notice_url) ? el('a', { href: s.privacy_notice_url, target: '_blank', rel: 'noopener', textContent: 'Privacy notice' }) : ''));

  // consent boxes: never pre-ticked, always optional
  const consents = cfg.purposes.filter(p => p.type === 'consent');
  if (consents.length) {
    const fs = el('fieldset', {}, el('legend', { textContent: 'Optional: I would like to' }));
    consents.forEach(p => fs.append(el('label', { className: 'chk' },
      el('input', { type: 'checkbox', name: 'c_' + p.purpose_id }), el('span', { textContent: p.wording }))));
    form.append(fs);
  }
  if (s.require_18_plus === 'Y') form.append(el('label', { className: 'chk' },
    el('input', { type: 'checkbox', name: 'age', required: true }), el('span', { textContent: 'I am 18 or older' })));

  form.append(el('div', { className: 'hp', ariaHidden: 'true' }, el('input', { type: 'text', name: 'website', tabIndex: -1, autocomplete: 'off' })));
  const btn = el('button', { type: 'submit', textContent: 'Submit' });
  const msg = el('div', { id: 'msg', role: 'status' });
  form.append(btn, msg, el('p', { className: 'mut', style: 'margin-top:16px' }, el('a', { href: '?p=data', textContent: 'Download my data' }), ' · ', el('a', { href: '?p=request', textContent: 'Correct or delete my data' })));

  const ERR = { email: 'Please check your email address.', age: 'You need to confirm you are 18 or older.',
    channel_data: 'Please add the phone or WhatsApp number for the channels you ticked.',
    busy: 'Too many attempts. Please try again in a few minutes.', stale: 'This form was just updated. Please review it and submit again.' };

  form.onsubmit = async ev => {
    ev.preventDefault();
    btn.disabled = true; msg.className = ''; msg.textContent = '';
    const fields = {};
    cfg.fields.forEach(f => { fields[f.field_id] = form.elements['f_' + f.field_id].value; });
    const body = {
      fields, config_version: cfg.version, t: startedAt, hp: form.elements.website.value,
      consents: consents.filter(p => form.elements['c_' + p.purpose_id].checked).map(p => p.purpose_id),
      age_ok: form.elements.age ? form.elements.age.checked : false,
      source: params.get('s') || '', page_url: location.href, referrer: document.referrer,
    };
    const res = await fetch(ENDPOINT, { method: 'POST', body: JSON.stringify(body) }).then(r => r.json()).catch(() => ({ ok: false, error: 'network' }));
    if (res.ok) { app.replaceChildren(el('p', { textContent: res.message || 'Thanks.' })); return; }
    msg.className = 'err';
    msg.textContent = ERR[res.error] || (String(res.error).startsWith('missing:') ? 'Please fill in the required fields.' : 'Something went wrong. Please try again.');
    btn.disabled = false;
    if (res.error === 'stale') load();
  };
  app.replaceChildren(form);
}

function renderData() {
  const s = cfg.settings, startedAt = Date.now();
  document.title = 'Download my data';
  if (/^#[0-9a-f]{3,8}$/i.test(s.brand_color)) document.documentElement.style.setProperty('--ac', s.brand_color);
  const form = el('form');
  if (/^https:\/\//i.test(s.logo_url)) form.append(el('img', { src: s.logo_url, alt: s.client_name }));
  const input = el('input', { type: 'email', id: 'em', name: 'em', required: true, autocomplete: 'email' });
  const btn = el('button', { type: 'submit', textContent: 'Email me the link' });
  const msg = el('div', { id: 'msg', role: 'status' });
  form.append(el('h1', { textContent: 'Download my data' }),
    el('p', { textContent: 'Enter the email address you signed up with. We will email you a secure link to download the information we hold about you. The link works for one hour.' }),
    el('label', { htmlFor: 'em', textContent: 'Email' }), input,
    el('div', { className: 'hp', ariaHidden: 'true' }, el('input', { type: 'text', name: 'website', tabIndex: -1, autocomplete: 'off' })),
    btn, msg,
    el('p', { className: 'mut', style: 'margin-top:16px' }, 'Want to correct or delete your data? ', el('a', { href: '?p=request', textContent: 'Make a request' }), '.'));
  form.onsubmit = async ev => {
    ev.preventDefault();
    btn.disabled = true; btn.textContent = 'Sending…'; msg.className = ''; msg.textContent = '';
    const ctl = new AbortController(), timer = setTimeout(() => ctl.abort(), 30000);
    const res = await fetch(ENDPOINT, { method: 'POST', signal: ctl.signal, body: JSON.stringify({
      action: 'mydata', fields: { email: input.value }, t: startedAt, hp: form.elements.website.value }) })
      .then(r => r.json()).catch(() => ({ ok: false, error: 'network' }));
    clearTimeout(timer);
    if (res.ok) { app.replaceChildren(el('p', { textContent: res.message || 'Thanks.' })); return; }
    msg.className = 'err';
    msg.textContent = res.error === 'email' ? 'Please check your email address.' :
      res.error === 'busy' ? 'Too many attempts. Please try again in a few minutes.' : 'Something went wrong. Please try again.';
    btn.disabled = false; btn.textContent = 'Email me the link';
  };
  app.replaceChildren(form);
}

function renderRequest() {
  const s = cfg.settings, startedAt = Date.now();
  document.title = 'Correct or delete my data';
  if (/^#[0-9a-f]{3,8}$/i.test(s.brand_color)) document.documentElement.style.setProperty('--ac', s.brand_color);
  const form = el('form');
  if (/^https:\/\//i.test(s.logo_url)) form.append(el('img', { src: s.logo_url, alt: s.client_name }));
  const radio = (v, t, on) => el('label', { className: 'chk' }, el('input', { type: 'radio', name: 'rtype', value: v, checked: on }), el('span', { textContent: t }));
  const input = el('input', { type: 'email', id: 'em', name: 'em', required: true, autocomplete: 'email' });
  const warn = el('p', { className: 'mut' });
  const btn = el('button', { type: 'submit', textContent: 'Email me a confirmation link' });
  const msg = el('div', { id: 'msg', role: 'status' });
  form.append(el('h1', { textContent: 'Correct or delete my data' }),
    el('p', { textContent: 'Tell us what you need. We will email a link to the address we hold, so we know it is you. Once you confirm, ' + s.responsible_party_legal_name + ' takes it from there.' }),
    el('fieldset', {}, el('legend', { textContent: 'I want to' }), radio('correct', 'Correct my details', true), radio('delete', 'Delete my data', false)),
    warn,
    el('label', { htmlFor: 'em', textContent: 'Email' }), input,
    el('div', { className: 'hp', ariaHidden: 'true' }, el('input', { type: 'text', name: 'website', tabIndex: -1, autocomplete: 'off' })),
    btn, msg,
    el('p', { className: 'mut', style: 'margin-top:16px' }, 'Want a copy of your data first? ', el('a', { href: '?p=data', textContent: 'Download my data' }),
      '. To stop marketing, use the unsubscribe link in any email. Anything else: ' + s.request_contact_email + '.'));
  const sync = () => {
    warn.textContent = form.elements.rtype.value === 'delete'
      ? 'We will email you a copy of your data and ask you to confirm. Nothing is deleted until you do. Deleting also removes you from our mailing lists. We may keep minimal records if the law requires it.'
      : 'We will email you a link. You will see what we hold and can change it yourself.';
  };
  form.addEventListener('change', sync);
  sync();
  form.onsubmit = async ev => {
    ev.preventDefault();
    btn.disabled = true; btn.textContent = 'Sending…'; msg.className = ''; msg.textContent = '';
    const ctl = new AbortController(), timer = setTimeout(() => ctl.abort(), 30000);
    const res = await fetch(ENDPOINT, { method: 'POST', signal: ctl.signal, body: JSON.stringify({
      action: 'request', type: form.elements.rtype.value, fields: { email: input.value },
      t: startedAt, hp: form.elements.website.value }) })
      .then(r => r.json()).catch(() => ({ ok: false, error: 'network' }));
    clearTimeout(timer);
    if (res.ok) { app.replaceChildren(el('p', { textContent: res.message || 'Thanks.' })); return; }
    msg.className = 'err';
    msg.textContent = res.error === 'email' ? 'Please check your email address.' :
      res.error === 'setup' ? 'This is not fully set up yet. Please contact ' + s.request_contact_email + '.' :
      res.error === 'busy' ? 'Too many attempts. Please try again in a few minutes.' : 'Something went wrong. Please try again.';
    btn.disabled = false; btn.textContent = 'Email me a confirmation link';
  };
  app.replaceChildren(form);
}

async function renderCorrect() {
  const s = cfg.settings;
  document.title = 'Correct my details';
  if (/^#[0-9a-f]{3,8}$/i.test(s.brand_color)) document.documentElement.style.setProperty('--ac', s.brand_color);
  const say = t => app.replaceChildren(el('p', { textContent: t }));
  const r = params.get('r') || '', x = params.get('x') || '', sg = params.get('s') || '';
  say('Loading your details…');
  const data = await fetch(ENDPOINT + '?a=reqdata&p=' + encodeURIComponent(r) + '&x=' + encodeURIComponent(x) + '&s=' + encodeURIComponent(sg))
    .then(res => res.json()).catch(() => ({ ok: false, error: 'network' }));
  if (!data.ok) {
    say(data.error === 'used' ? 'This request has already been completed.' :
      data.error === 'expired' ? 'This link is invalid or has expired. Please make your request again.' :
      'Something went wrong. Please try again.');
    return;
  }
  const row = (a, b) => el('tr', {}, el('th', { textContent: a }), typeof b === 'string' ? el('td', { textContent: b || '—' }) : el('td', {}, b));
  const table = rows => el('div', { className: 'wrap' }, el('table', {}, el('tbody', {}, ...rows)));
  const wrap = el('div');
  if (/^https:\/\//i.test(s.logo_url)) wrap.append(el('img', { src: s.logo_url, alt: s.client_name }));

  const view = el('div');
  view.append(el('h2', { textContent: 'What we hold about you' }),
    table(data.fields.map(f => row(f.label, f.value)).concat(data.held.map(h => row(h.label, h.value)))),
    el('h2', { textContent: 'Your choices' }),
    table(data.consents.map(c => row(c.purpose, c.active ? 'Active' : 'Not active'))),
    el('p', { className: 'mut', style: 'margin-top:14px', textContent: 'Email, phone and WhatsApp cannot be changed here. They are how we confirm it is you and reach you. To change them, contact ' + s.request_contact_email + '.' }));

  const form = el('form');
  const inputs = data.fields.map(f => {
    let input;
    if (f.type === 'textarea') input = el('textarea', { rows: 3, value: f.value });
    else if (f.type === 'select') {
      input = el('select', {}, el('option', { value: '', textContent: 'Select…' }), ...f.options.map(o => el('option', { value: o, textContent: o })));
      input.value = f.value;
    } else input = el('input', { type: 'text', value: f.value });
    input.setAttribute('aria-label', f.label);
    return { f, input };
  });
  const boxes = data.consents.map(c => {
    const box = el('input', { type: 'checkbox', checked: c.active, disabled: !c.active && !c.can_grant });
    const note = !c.active && !c.can_grant ? ' (We do not hold the details for this. Contact ' + s.request_contact_email + '.)' : '';
    return { c, box, node: el('label', { className: 'chk' }, box, el('span', { textContent: (c.wording || c.purpose) + note })) };
  });
  const btn = el('button', { type: 'submit', textContent: 'Submit changes' });
  const msg = el('div', { id: 'msg', role: 'status' });
  form.append(el('p', { className: 'mut', textContent: 'Change anything that is wrong and leave the rest. Only what you change is updated.' }),
    table(inputs.map(({ f, input }) => row(f.label + (f.required ? ' *' : ''), input))),
    el('h2', { textContent: 'Your choices' }), ...boxes.map(b => b.node), btn, msg);

  const t1 = el('button', { type: 'button', textContent: 'Existing data' });
  const t2 = el('button', { type: 'button', textContent: 'Amendments' });
  const show = n => {
    view.hidden = n !== 1; form.hidden = n !== 2;
    t1.setAttribute('aria-selected', String(n === 1)); t2.setAttribute('aria-selected', String(n === 2));
  };
  t1.onclick = () => show(1); t2.onclick = () => show(2);
  wrap.append(el('h1', { textContent: 'Correct my details' }), el('div', { className: 'tabs', role: 'tablist' }, t1, t2), view, form);
  show(1);

  const startedAt = Date.now();
  form.onsubmit = async ev => {
    ev.preventDefault();
    msg.className = 'err'; msg.textContent = '';
    const changed = {};
    for (const { f, input } of inputs) {
      const v = input.value.trim();
      if (f.required && !v) { msg.textContent = 'Please fill in: ' + f.label + '.'; return; }
      if (v !== f.value) changed[f.field_id] = v;
    }
    const cons = {};
    boxes.forEach(b => { if (b.box.checked !== b.c.active) cons[b.c.purpose_id] = b.box.checked; });
    if (!Object.keys(changed).length && !Object.keys(cons).length) { msg.textContent = 'Nothing has changed yet.'; return; }
    btn.disabled = true; btn.textContent = 'Saving…'; msg.className = ''; msg.textContent = '';
    const ctl = new AbortController(), timer = setTimeout(() => ctl.abort(), 30000);
    const res = await fetch(ENDPOINT, { method: 'POST', signal: ctl.signal, body: JSON.stringify({
      action: 'correct', r: r, x: x, s: sg, fields: changed, consents: cons, t: startedAt - 5000, hp: '' }) })
      .then(rr => rr.json()).catch(() => ({ ok: false, error: 'network' }));
    clearTimeout(timer);
    if (res.ok) {
      app.replaceChildren(el('h1', { textContent: 'Details updated' }), el('p', { textContent: res.message || 'Thanks.' }),
        ...(res.changed || []).map(c => el('p', { className: 'mut', textContent: c })));
      return;
    }
    msg.className = 'err';
    msg.textContent = res.error === 'expired' ? 'This link has expired. Please make your request again.' :
      res.error === 'used' ? 'This request has already been completed.' :
      String(res.error).startsWith('missing') ? 'Please fill in the required details.' :
      res.error === 'bad_option' ? 'Please pick one of the options.' :
      res.error === 'channel_data' ? 'We do not hold the details for that choice. Contact ' + s.request_contact_email + '.' :
      res.error === 'busy' ? 'Too many attempts. Please try again in a few minutes.' : 'Something went wrong. Please try again.';
    btn.disabled = false; btn.textContent = 'Submit changes';
  };
  app.replaceChildren(wrap);
}

load();
</script>
</body>
</html>
